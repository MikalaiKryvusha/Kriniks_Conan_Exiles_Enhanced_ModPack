; Compile-only localization config for the Hosav UI Russian overlay (KUMM experiment 2026-09-12).
; Mirrors UE4/Config/Localization/Exiles_UI_Compile.ini with a private target under Saved/Loc.
[CommonSettings]
SourcePath=Saved/Loc/HosavRU
DestinationPath=Saved/Loc/HosavRU
ManifestName=HosavRU.manifest
ArchiveName=HosavRU.archive
ResourceName=HosavRU.locres
bSkipSourceCheck=true
bValidateFormatPatterns=false
bValidateSafeWhitespace=false
bValidateRichTextTags=false
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=GenerateTextLocalizationResource
