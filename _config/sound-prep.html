<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звук полного натяжения</title>
<style>
  :root { --bg: #f4efe6; --fg: #2b2620; --muted: #7a6f60; --line: #ddd2bf; --accent: #a0522d; --row: #fbf8f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1a16; --fg: #ece4d6; --muted: #a39682; --line: #3a332a; --accent: #e08a5a; --row: #26221d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .all { font: inherit; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin-bottom: 18px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-bottom: 8px; background: var(--row); border: 1px solid var(--line); border-radius: 12px; }
  li.on { border-color: var(--accent); }
  li button { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 22px; cursor: pointer; }
  .n { width: 28px; color: var(--muted); text-align: right; flex: none; }
  .t { flex: 1; overflow-wrap: anywhere; }
  .d { color: var(--muted); flex: none; }
</style>
</head>
<body>
<main>
  <h1>Звук полного натяжения лука</h1>
  <p>{{COUNT}} звуков. Громкость выровнена, тишина спереди срезана, после удара — не дольше 4 с, в конце затухание. Назовите номер, который ставить в игру.</p>
  <button class="all" id="all">▶ Слушать все подряд</button>
  <ul id="list">
{{ITEMS}}
  </ul>
</main>
<script>
  const player = new Audio();
  const rows = [...document.querySelectorAll('#list li')];
  let queue = [];
  function play(li) {
    rows.forEach(r => { r.classList.remove('on'); r.querySelector('button').textContent = '▶'; });
    li.classList.add('on');
    li.querySelector('button').textContent = '■';
    player.src = li.querySelector('button').dataset.src;
    player.currentTime = 0;
    player.play();
  }
  function stop() { player.pause(); queue = []; rows.forEach(r => { r.classList.remove('on'); r.querySelector('button').textContent = '▶'; }); }
  rows.forEach(li => li.querySelector('button').addEventListener('click', () => {
    if (li.classList.contains('on') && !player.paused) { stop(); return; }
    queue = []; play(li);
  }));
  player.addEventListener('ended', () => {
    if (queue.length) { setTimeout(() => queue.length && play(queue.shift()), 700); }
    else rows.forEach(r => { r.classList.remove('on'); r.querySelector('button').textContent = '▶'; });
  });
  document.getElementById('all').addEventListener('click', () => { queue = rows.slice(1); play(rows[0]); });
</script>
</body>
</html>
