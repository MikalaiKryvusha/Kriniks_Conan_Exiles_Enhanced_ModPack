  const gold = (t, extra = '') => `<div class="pl gold ${t.length > 8 ? 'long' : ''} ${extra}"><span>${t}</span></div>`
  const status = html => `<div class="status sh">${html}</div>`
  // Список состояния: [подпись, значение, класс]; подпись пустая — строка без подписи.
  const st = items => `<div class="st sh">${items.map(([k, v, c = '']) =>
    k ? `<i></i><b class="${c}">${k}:</b><span class="${c}">${v}</span>` : `<i></i><span class="wide ${c}">${v}</span>`).join('')}</div>`
  const bar = (p, what, meta) => `<div class="prog"><div class="what">${what}</div><div class="bar" style="--p:${p}"><i></i><em></em><b>${p} %</b></div>${meta ? st(meta) : ''}</div>`
  // Папка и версия игры — две величины, каждая на своей строке (2026-11-18 15:1x, русский язык макетов по слову владельца 15:03).
  // Путь переносится только после «\», чтобы имя папки не рвалось посреди слова («steamapps\c» / «ommon»).
  const path = p => p.replace(/\\/g, '\\<wbr>')
  const game = (v = '3.1.1') => [['Папка игры', path(STEAM)], ['Версия игры', v]]
  // Низ колонки: «Руководство», «Отзыв» и то, что добавляет состояние («Удалить сборку»).
  const low = (...more) => `<div class="low">${[btn('Руководство'), btn('Отзыв'), ...more].join('')}</div>`
  // Колонка сверху вниз: золотая главная (если есть) · состояние списком или полоса прогресса · низ.
  const SCREENS = {
    search: [bar(60, 'Поиск игры на дисках', [['Проверено дисков', '2 из 3'], ['Сейчас проверяется', 'диск D']]), low()],
    // Под модальным окном — лаунчер в том состоянии, из которого его открыли: поиск закончен.
    choose: [gold('Установить сборку', 'off'), st([['Поиск игры', 'закончен'], ['Найдено копий', '5']]), low()],
    notfound: [gold('Указать папку игры'), st([['', 'Лаунчер не нашёл игру ни&nbsp;в&nbsp;библиотеках Steam, ни&nbsp;в&nbsp;папках Games на&nbsp;дисках, ни&nbsp;в&nbsp;Program Files.', 'warn'],
      ['', 'Если игра установлена в другой папке, нажмите «Указать папку игры» и выберите эту папку.']]), low()],
    'found-files': [gold('Установить сборку'), st([...game(), ['Сборка', '0.9.1 для игры 3.1.1'], ['Файлы сборки', 'уже лежат рядом с&nbsp;лаунчером']]), low()],
    'found-nofiles': [gold('Установить сборку'), st([...game(), ['Сборка', '0.9.1 для игры 3.1.1'], ['Файлы сборки', 'лаунчер скачает с GitHub'],
      ['Нужно скачать', '6,8 ГБ']]), low()],
    download: [bar(37, 'Скачивание сборки 0.9.1',
      [['Скачано', '2,5 из 6,8 ГБ'], ['Скорость', '18,4 МБ/с'], ['Осталось времени', '3 мин 55 с'], ['Прошло времени', '2 мин 16 с']]), btn('Остановить'), low()],
    neterror: [gold('Продолжить скачивание'), st([['', 'Связь с GitHub прервалась, и скачивание остановилось.', 'warn'], ['Скачано', '2,5 из 6,8 ГБ'],
      ['', 'Лаунчер сохранил скачанные файлы и докачает только недостающие.']]), low()],
    install: [bar(64, 'Установка сборки 0.9.1', [['Скопировано модов', '46 из 72'], ['Прошло времени', '41 с'], ['', 'Не закрывайте лаунчер, пока идёт установка.']]), low()],
    // 10:18–10:19: на установленной сборке списка состояния нет — версии игры и сборки уже стоят под логотипами, путь отвлекает игрока.
    installed: [gold('Играть'), low(btn('Удалить сборку'))],
    noversion: [st([...game('3.2.0'), ['', 'Сборка для игры 3.2.0 ещё не вышла.', 'warn'], ['Последняя сборка', '0.9.1 для игры 3.1.1']]), low()],
    update: [gold('Играть'), low(btn('Удалить сборку'))],
    // 15:55: выбор языка — раскрытый список поверх установленной сборки.
    language: [gold('Играть'), low(btn('Удалить сборку'))],
    // 2026-11-20: плашка «О проекте» открыта поверх установленной сборки.
    about: [gold('Играть'), low(btn('Удалить сборку'))],
    updating: [bar(22, 'Обновление сборки до 0.9.2',
      [['Скачано', '0,4 из 1,9 ГБ'], ['Скорость', '21,0 МБ/с'], ['Осталось времени', '1 мин 13 с'], ['Прошло времени', '19 с']]), btn('Остановить'), low()],
  }
  // Метка нового элемента (HOUSE_RULES 23), одна на кнопку и одна на плашку.
  const TODO = '<span class="tag">нет механики — будет сделано</span>'
  const PLATES = {
    // Плашка «О проекте»: тексты взяты из README сборки, их владелец прочитал 2026-11-20 12:13 (разделы 7 и 8); ссылки — из author_links.txt.
    about: `<div class="modal-dim"></div><div class="modal aboutbox">${TODO}<div>
      <h3>О проекте</h3>
      <h4>Автор сборки</h4>
      <p>В сборке Николаю Кривуше (Коту Кринику) принадлежат подбор модов и порядок их загрузки, настройки, перевод, доработки модов с пометкой KRINIK MODIFIED, собственные моды Krinik и лаунчер.</p>
      <p>Моды других авторов принадлежат своим законным правообладателям — авторам модов в Мастерской Steam и на Nexus Mods.</p>
      <h4>Ссылки</h4>
      <div class="lnk"><b>Почта:</b><a>kotkrinik@yandex.ru</a><b>Nexus Mods:</b><a>nexusmods.com/conanexilesenhanced/mods/65</a><b>GitHub:</b><a>github.com/MikalaiKryvusha/Kriniks_Conan_Exiles_Enhanced_ModPack</a></div>
      <p class="lic">Сборка выпущена под лицензией MIT. © 2026 Mikalai Kryvusha aka KOT KRINIK.</p>
      <div class="btns"><div class="pl gold"><span>Закрыть</span></div></div>
    </div></div>`,
    language: `<div class="langlist"><div><div class="item on">Русский<em>RU</em></div><div class="item">English<em>EN</em></div></div></div>`,
    update: `<div class="plate sh"><div class="frame"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div><p>Вышла сборка <b>0.9.2</b> для игры 3.1.1</p><div class="pl gold"><span>Обновить сборку</span></div></div>`,
    choose: `<div class="modal-dim"></div><div class="modal"><div>
      <h3>Найдено копий игры: <b>5</b></h3>
      <p>Выберите, в какую копию игры установить сборку. Лаунчер подберёт последнюю сборку для версии игры в выбранной копии.</p>
      <div class="list"><div class="rows">
        <div class="row on"><i></i><div><b>Conan Exiles 3.1.1 <em>· без модов</em></b><span>${STEAM}</span></div></div>
        <div class="row"><i></i><div><b>Conan Exiles 3.1.1 <em>· установлена сборка 0.9.0</em></b><span>D:\\Games\\Conan Exiles</span></div></div>
        <div class="row"><i></i><div><b>Conan Exiles 3.1.1 <em>· установлены другие моды</em></b><span>D:\\SteamLibrary\\steamapps\\common\\Conan Exiles</span></div></div>
        <div class="row"><i></i><div><b>Conan Exiles 3.0.1 <em>· без модов, подойдёт сборка 0.9.0</em></b><span>E:\\Games\\Conan Exiles 3.0.1</span></div></div>
        <div class="row"><i></i><div><b>Conan Exiles 3.1.1 <em>· без модов</em></b><span>E:\\Games\\Conan Exiles</span></div></div>
      </div><div class="sb"><s></s></div></div>
      <div class="btns"><div class="pl cancel"><span>Отмена</span></div><div class="pl gold"><span>Установить сборку</span></div></div>
    </div></div>`,
  }
  const win = (id, col) => `
<div class="win" data-screen="${id}">
  <div class="frame"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
  <div class="lang${id === 'language' ? ' open' : ''}"><div class="pl"><span>RU<svg viewBox="0 0 10 10"><path d="${id === 'language' ? 'M1.5 6.5 5 3l3.5 3.5' : 'M1.5 3.5 5 7l3.5-3.5'}"/></svg></span></div></div>
  <div class="caps">
    <div class="pl"><span><svg viewBox="0 0 14 14"><path d="M1.5 10h11"/></svg></span></div>
    <div class="pl"><span><svg viewBox="0 0 14 14"><path d="M2 2l10 10M2 12 12 2"/></svg></span></div>
  </div>
  <div class="lver"><div class="pl"><span>Лаунчер: 1.0.0</span></div></div>
  <div class="top sh">
    <div class="lg g"><img src="../res/logo-game.png"><div class="v"><b>3.1.1</b>${btn('Что нового')}</div></div>
    <div class="lg p"><img src="../res/logo-pack.png"><div class="v"><b>0.9.1</b>${btn('Что нового')}</div></div>
    <div class="titles"><h1>Сборка модов Krinik Mod Pack 0.9.1</h1><h2>Conan Exiles Enhanced 3.1.1</h2></div>
  </div>
  ${PLATES[id] || ''}
  <div class="col">${col.join('')}</div>
  <div class="about sh">${btn('О проекте')}${TODO}</div>
</div>`
  document.getElementById('all').innerHTML = Object.entries(SCREENS).map(([id, col]) => win(id, col)).join('')
</script>
