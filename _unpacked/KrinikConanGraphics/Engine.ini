; ---------------------------------------------------------------------------
; Блок сборки Krinik. Всё, что ниже, дописано поверх ванильного [Core.System].
;
; ПОЧЕМУ ЗДЕСЬ ТАК МАЛО. Правка ini НЕ является проверкой: в Palworld четырнадцать
; заходов "по одному cvar-у через ini" дали четырнадцать ложных оправданий подряд,
; потому что игра затирала строки при входе в мир (EXP-0009). У Конана та же
; болезнь наблюдается прямо: все пять конфигов переписаны игрой при выходе из
; сессии 08.09.2026 0:01:58. Поэтому сюда едет только то, что уже проверено
; наблюдением ЛИБО читается на старте движка и иначе не проверяется вовсе.
; Кандидаты, ждущие живой проверки консолью, лежат в Engine.ini.candidates.ini
; и НЕ раскатываются.
; ---------------------------------------------------------------------------
[SystemSettings]

; --- Отражения воды: программные отражения Lumen с увеличенной дальностью ----
; Без лучей видеокарты и без экранного пространства (у экранного — белые полосы за стволами,
; владелец 2026-11-08 «экранное отражение - зло»). Поля расстояний в игре есть, но по умолчанию
; лучи не долетали дальше ближних метров, и вода показывала одно небо. Дальность ×4, 6 слоёв по
; 50 м: дальний берег, скалы и арки отражаются мягко по всей воде, цена ≈ 1 % кадров
; (KUMM researches/conan-water-reflections, отчёт 2026-11-09_conan-water-reflections-five-scenes).
; Слово владельца 2026-11-09 01:47: «Твой вариант програмных отражений ОХУЕНЕН. самый красивый. Его и берём».
r.RayTracing.Enable=0
r.Lumen.Reflections.ScreenTraces=0
r.Lumen.Reflections.DistantScreenTraces=0
r.Lumen.TraceDistanceScale=4
r.AOGlobalDistanceField.NumClipmaps=6
r.LumenScene.GlobalSDF.ClipmapExtent=5000

; --- DLSS -------------------------------------------------------------------
; ГЛАВНАЯ СТРОКА ФАЙЛА. Владелец просил "DLSS 4.5". Выяснилось, что DLSS 4.5 -
; это официальное имя NVIDIA (SDK 310.5.0, январь 2026, добавил пресеты L и M),
; и в игре УЖЕ лежит nvngx_dlss.dll ровно версии 310.5.0. То есть 4.5 был на
; месте с самого начала - не выбран был только пресет.
;
; Шкала снята из строк самого билда (help-текст cvar-а):
;   0 = пресет по умолчанию   1..7 = A..G   10 = J   11 = K   12 = L   13 = M
; Берём M. Основание - DLSS Programming Guide рев. 310.6.0, раздел 3.12:
; "Preset M: даёт улучшения качества, сравнимые с Preset L, но по скорости
; ближе к пресетам J и K". L резче, но дороже (+150 МБ VRAM в 4K) и ПРИНУДИТЕЛЬНО
; переходит на автоэкспозицию, что меняет вид картинки в игре со своей экспозицией.
; Откат: 11 = K, штатное поведение NVIDIA App для режимов Качество/Баланс/DLAA.
; [NOT-TESTED] на глаз владельцем - это класс "на вкус", и судить картинку ему.
; ⛔ 3.0.1 (DLSS 310.9, Streamline 2.14), 2026-10-25 16:56: с этой строкой игра падает на первом
; кадре DLSS - «EXCEPTION_ACCESS_VIOLATION writing address 0», Breadcrumbs 'RHIThread' DLSS →
; PostProcessing. Деление пополам двумя запусками: без r.NGX.DLSS.* - жива, с Enable=1 без Preset - жива,
; в мире держится (70,8 к/с в 4K). Баг KUMM bugs/63. Пресет теперь - штатный выбор игры.
;r.NGX.DLSS.Preset=13

; --- Размытие в движении ----------------------------------------------------
; Владелец: "не люблю его" (08.09.2026), выключаем насовсем.
; ПОЧЕМУ ИМЕННО ЭТА СТРОКА, А НЕ r.MotionBlurQuality=0. Качество размытия
; приходит из группы масштабируемости (в снятом слепке применённых cvar-ов оно
; видно как "[PostProcessQuality@3] из файла Scalability -> r.MotionBlurQuality = 4"),
; а Scalability (0x05) перебивает [SystemSettings] (0x04). То есть наш ноль там
; прожил бы до первого применения настроек графики. r.DefaultFeature.MotionBlur
; ни в одной группе качества не участвует - он приходит из
; [/Script/Engine.RendererSettings] (0x03), и [SystemSettings] его перебивает.
; Проверка после запуска - способом из docs/01: ввести в консоли имя cvar-а без
; значения и прочитать действующее.
r.DefaultFeature.MotionBlur=0

; --- Дальность --------------------------------------------------------------
; ⚠ ЧЕСТНОЕ ПРЕДУПРЕЖДЕНИЕ ПО СЛЕДУЮЩИМ ЧЕТЫРЁМ СТРОКАМ.
; В бинарнике игры найдены СТРОКИ ФОРМАТА консольных команд, которые игра
; выполняет сама: "sg.ViewDistanceQuality={0}", "r.ViewDistanceScale=%d",
; "r.Shadow.DistanceScale=%d", "r.SkeletalMeshLODBias=-10". Команда из консоли
; имеет приоритет SetByConsole (0x0E), а [SystemSettings] - всего 0x04. Значит
; игра, применяя свои настройки графики, ПЕРЕБИВАЕТ эти строки, и надёжный рычаг
; дальности здесь - не ini, а группа sg.ViewDistanceQuality в GameUserSettings.ini
; (в этом билде она принимает 4 = Cinematic, не только 3).
; Строки оставлены как нижняя граница на случай, если игра применит их не всегда,
; и как явная запись гипотезы. Проверяется одним заходом: открыть консоль в мире
; и ввести имя cvar-а без значения - оно напечатает ДЕЙСТВУЮЩЕЕ значение.
; 2026-11-09: живьём при 2.0 в ini читалось 2.0, после 1.5 в ini - 1.5 (все три ключа, sg.ViewDistanceQuality=4):
; эти строки ДОЕЗЖАЮТ до сцены, игра их не перебивает - предупреждение выше для них опровергнуто.
; [TESTED: 2026-11-09 · чтение GetConsoleVariableFloatValue в мире после запуска · testcases/reports/2026-11-09_conan-water-fps-after-ram-tuning.md]
; Дальность 2.0 -> 1.5 по слову владельца (KAGO-чат 2026-11-09 ~13:4x: «дальность в конане ставим 1.5» ·
; «остальное по конану не трогаем»; KUMM plans/51 S6). r.StaticMeshLODDistanceScale ниже не тронут.
; [NOT-TESTED]
r.ViewDistanceScale=1.5

; Листва и трава: без них ViewDistanceScale поднимает только дальний рельеф,
; а кусты по-прежнему обрываются кругом вокруг игрока.
; [NOT-TESTED]
foliage.LODDistanceScale=1.5
grass.CullDistanceScale=1.5

; Меши дальних объектов переключаются на грубый LOD позже.
; ВНИМАНИЕ, НАПРАВЛЕНИЕ ОБРАТНОЕ: help-текст говорит "большие значения переводят
; LOD раньше, 2 = вдвое ближе". Значит для БОЛЬШЕЙ дальности нужно МЕНЬШЕ 1.
; [NOT-TESTED]
r.StaticMeshLODDistanceScale=0.75

[/Script/ConanSandbox.SystemSettings]

; ============================================================================
; ЭТА СЕКЦИЯ ПРИМЕНЯЕТСЯ ПОСЛЕДНЕЙ из четырёх, которые игра читает из Engine.ini
; (наблюдение, ConanSandbox.log 08.09.2026: [ConsoleVariables] в 09:27:39,
; эта - в 09:27:46). Кто позже, тот и побеждает при равном приоритете.
;
; ⚠️ ЧЕСТНАЯ ЗАПИСЬ ОБ ОШИБКЕ, чтобы следующая сессия не повторила ход.
; Секция заводилась под гипотезу «игра гасит DLSS строкой r.NGX.DLSS.Enable:0
; в [ConsoleVariables], поэтому DLSS не работает». Гипотеза ОКАЗАЛАСЬ НЕВЕРНОЙ.
; Игра действительно гасит все апскейлеры при старте, но потом включает
; выбранный сама. Доказательство - её собственный журнал, строка 2210:
;
;   LogDLSSNGXRHI: Creating NGX DLSS Feature
;     SrcRect=[0x0->2562x1441]  DestRect=[0x0->3840x2160]  ScaleX=0.667
;     NGXDLSSPreset=Preset M(13)  NGXPerfQuality=MaxQuality(2)
;
; То есть DLSS РАБОТАЕТ: рендер 2562x1441, вывод 4K, пресет M - ровно наш.
; Сбил с толку оверлей NVIDIA, показавший «DLSS Выкл»: он, судя по всему,
; докладывает о генерации кадров или о DLSS Override из NVIDIA App, а не о
; DLSS Super Resolution. Урок: судить по журналу игры, а не по оверлею.
;
; Строки ниже ОСТАВЛЕНЫ как подстраховка (вреда нет, значения совпадают с тем,
; что игра выставляет сама), но лечили они не ту болезнь.
; ============================================================================

r.NGX.DLSS.Enable=1
;r.NGX.DLSS.Preset=13   ⛔ роняет 3.0.1 - см. выше и bugs/63

; --- Высотный туман -----------------------------------------------------------
; ПРАВКА 08.09.2026 по слову владельца после первого живого запуска: «много дымки
; в лощинах... в Палворлде мы его выключили - он жрёт FPS и не делает игру красивее».
;
; Объёмный туман у нас уже выключен штатным выключателем игры (Game.ini ->
; [Settings.Video] VolumetricFog=0). Значит дымка в лощинах - НЕ он, а высотный
; экспоненциальный туман, и гасится он строкой ниже. Ровно тот же разбор, что в
; паке Palworld 31.08.2026 (_unpacked/UltraGraphics/config.lua) - там дошли до
; того же вывода тем же путём.
;
; Имя ЕСТЬ в реестре cvar-ов этой сборки (проверено grep-ом по cvars-registered.txt).
; Механизм: r.Fog гасит и объёмный туман тоже - froxel-объём считается в том же
; проходе; у нас он и так 0, пересечения нет.
; ЦЕНА КАРТИНКИ: мир станет контрастнее и «ближе», дальние планы потеряют воздушную
; перспективу. В пустыне это заметнее, чем в лесу.
; ОТКАТ: r.Fog=1.
;
; ПРОБА 25.10.2026 по слову владельца: «по моду погоды - ставим, попродуем сразу с настройками
; тумана, как у него задано. затем я потестирую и ты потестируешь производительность - может
; отключим туман». Severe Weather Enhanced рисует атмосферу высотным и объёмным туманом
; (ConanExiles/docs/15), поэтому на пробу туман включали.
; ИТОГ ПРОБЫ 25.10 ≈16:55: замер PresentMon в дневной пустыне, 4K - с туманом 11,68/11,70 мс,
; без 11,63/11,81 мс (разница в шуме); владелец: «вижуально мне без тумана нравится» - выключен.
r.Fog=0

; --- Дальние тени --------------------------------------------------------------
; ПРАВКА 08.09.2026 по слову владельца: «дальние тени немного топорные, медленно
; пошагово меняют своё состояние, хочется чуть больше качества и плавности».
;
; Игра рисует тени ВИРТУАЛЬНЫМИ ТЕНЕВЫМИ КАРТАМИ (r.Shadow.Virtual.Enable:1).
; Что ставила группа качества 3, из журнала:
;     ResolutionLodBiasDirectional        -0.5
;     ResolutionLodBiasDirectionalMoving  -0.5
;     MaxPhysicalPages                    1792
;
; Справка Funcom к первой ручке дословно: «Bias applied to LOD calculations for
; directional lights. -1.0 doubles resolution, 1.0 halves it and so on.»
; То есть -0.5 это полуторное разрешение, а -1.0 - двойное. Это и есть ответ на
; «топорные».
;
; Про «пошагово меняет состояние»: у солнца Конана есть своя ручка
; DynamicSky.SolarUpdateAngleDelta = 0.015 - «сколько градусов солнце пройдёт по
; небу, прежде чем повернуть направленный свет». Каждый такой поворот сбрасывает
; кэш теневых страниц, и они перерисовываются НЕ ВСЕ СРАЗУ, а по кругу
; (round-robin) в пределах бюджета страниц. Отсюда и «медленно, пошагово».
; Лечится не шагом солнца (0.015 и так мелкий), а БЮДЖЕТОМ: чем больше страниц,
; тем меньше остаётся догонять. 1792 -> 4096; у владельца 16 ГБ видеопамяти.
;
; ЦЕНА: двойное разрешение теней плюс вдвое больший пул страниц - это нагрузка на
; видеокарту. Если кадры просядут заметно, откатывать ПО ОДНОЙ: сперва
; MaxPhysicalPages в 1792, потом Bias в -0.5.
; [NOT-TESTED] - судить глазами владельца, это класс «на вкус».
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-1.0
r.Shadow.Virtual.MaxPhysicalPages=4096

; ДОБАВЛЕНО ПОСЛЕ СВЕРКИ с нашими же конспектами по слову владельца
; ("можешь с нашими конспектами по веб-разведке сверяться и с Палворлдом").
; Сверка дала главное, чего не было в моём разборе.
;
; KUMM/researches/ue5-cvars/shadows.md, раздел "Как считается", п.7:
;   «Кэш инвалидируется: движением/поворотом источника - ТЯЖЕЛЕЕ ВСЕГО
;    ВРАЩАЮЩЕЕСЯ СОЛНЦЕ ИНВАЛИДИРУЕТ КЛИПМАП ЦЕЛИКОМ»
; В Конане солнце крутится непрерывно (DynamicSky.SolarUpdateAngleDelta=0.015).
; То есть жалоба владельца - учебниковый случай, а не особенность сборки.
;
; Лекарство названо там же и СТОИТ В НАСТРОЕННОМ PALWORLD, а у Конана в группе
; качества отсутствует вовсе:
;   Cache.StaticSeparate - «статика в отдельных страницах от динамики,
;   УДВАИВАЕТ память пула, ЭКОНОМИТ ПЕРЕРИСОВКУ».
; Статические страницы (рельеф, постройки) переживают поворот солнца, и
; догонять по кругу остаётся кратно меньше.
; ⚠️ ОТОЗВАНО 08.09.2026, СТРОКА МЁРТВАЯ, НЕ ВОЗВРАЩАТЬ:
;     r.Shadow.Virtual.Cache.StaticSeparate=1
; Имени НЕТ в реестре cvar-ов этой сборки (проверено grep-ом по
; _config/cvars-registered.txt: ноль совпадений). Оно существовало в UE 5.1,
; на котором работает Palworld, откуда я его и пересадил, — и к UE 5.6 исчезло.
; В журнале игры строка не появляется вовсе: движок молча глотает неизвестное
; имя (правило 1 конспекта dw.*).
; УРОК: пересадка настройки между версиями движка проверяется по РЕЕСТРУ ЦЕЛИ
; ДО правки, а не после. Реестр у нас есть, и это стоило одного пустого захода.

; Из настроенного Palworld, и это имя в 5.6 живо: выбор страниц на выброс по
; давности использования вместо произвольного.
r.Shadow.Virtual.Cache.AllocateViaLRU=1

; --- ШАГ СОЛНЦА: вот она, причина «тени тикают рывками» -----------------------
; НАБЛЮДЕНИЕ, а не гипотеза. В журнале игры:
;     Section [ShadowQuality@3] -> Set CVar [[DynamicSky.SolarUpdateAngleDelta:0.015f]]
; Справка Funcom к этому имени: «How many degrees can the sun/moon move in the
; sky before we rotate the corresponding directional light to match».
;
; То есть свет солнца поворачивается НЕ ПЛАВНО, а ДИСКРЕТНЫМИ РЫВКАМИ по 0.015
; градуса. Каждый рывок — это и есть «тик», который видит владелец. Группа
; качества @Cine это значение НЕ переопределяет (проверено: в её списке имени
; нет), поэтому оно остаётся 0.015 даже на максимальном качестве.
;
; Уменьшаем шаг впятеро — свет поворачивается чаще и мельче, движение сливается.
; ПОЧЕМУ ЭТО СТАЛО ПО КАРМАНУ ИМЕННО СЕЙЧАС: каждый поворот солнца сбрасывает
; кэш теневых страниц, и раньше платить за учащение было нечем. Теперь бюджет
; поднят до 4096 страниц группой @Cine — сперва заплатили за инвалидацию, потом
; учащаем. Порядок именно такой, обратный не работает.
;
; ЦЕНА: больше перерисовок теней в секунду. Если кадры просядут — вернуть 0.015,
; это одна строка. Промежуточные значения: 0.005, 0.008.
; [NOT-TESTED]
;
; 2026-10-29 (KUMM bug 67, re-recon researches/conan-shadow-flicker/2026-10-29_recon.md): 0.003 WAS the cause of the palm leaf shadow flicker —
; every turn of the sun light invalidates the VSM pages, ~50 turns a second. Live A-B-A under palms, the owner's eye: 2.0 — «ну сейчас словно тени
; в порядке»; back to 0.003 — «да, вернулось». 2.0 = the light turns in a step every few seconds; if the step itself is noticed, 1.0 or 0.5.
; [TESTED: 2026-10-29 · live exec A-B-A, the owner's verdict both ways]
; 2026-11-07 15:44 (KUMM bug 67): any visible step is rejected — the owner 14:53 «2 ГРАЗУСА, 0.1 ГРАДУС - это ЕПРИЕМЛЕМО РЕЗКОЕ ДВИЖЕНИЕ ТЕНЕ!»; live by his eye
; 0.03 → 0.01 → 0.005: at 0.005 «вот теперь тени ПЛАВНЫЕ!!!!» (15:45). The leaf flicker is a separate fix (the leaf material), not bought with steps.
; 16:12 the owner: «тень нужно ещё плавнее в 2 раза» → 0.0025.
; [TESTED: 2026-11-07 16:12 · live exec at the oasis, the owner's word; read back 0.0025]
DynamicSky.SolarUpdateAngleDelta=0.0025

; ЗАПАС, если этого мало. По лестнице Epic из нашего конспекта (раздел 10)
; уровень @3 - это bias -1.5 и 4096 страниц, @Cine - -1.5 и 8192. У Конана
; собственная группа 3 даёт всего -0.5 и 1792, то есть его лестница СДВИНУТА
; ВНИЗ примерно на ступень. Значит место для роста есть.
; Правило конспекта: bias трогать ШАГАМИ ПО 0.5, потому что спрос на страницы
; растёт как ×4 на каждую единицу. Мы сделали один шаг: -0.5 -> -1.0.
;
; ПРИБОР, если тени вдруг ГЛОБАЛЬНО помылятся: это признак переполнения пула в
; UE 5.4+ (в 5.0-5.3 была бы "шахматка"). Смотреть консолью:
;     r.Shadow.Virtual.ShowStats 1
; и, если кэш кипит, - кто виноват:
;     r.Shadow.Virtual.Cache.DrawInvalidatingBounds 1

